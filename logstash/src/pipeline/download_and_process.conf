input {
  # 输入插件：定期执行下载和解压脚本
  exec {
    command => "/usr/share/logstash/scripts/download_and_process.sh" # 执行脚本的路径
    interval => 3600 # 执行间隔（秒），例如每小时一次。请根据需求调整。
  }
}

filter {

}

output {
  # 输出插件：将事件（例如下载状态）打印到标准输出，便于调试
  stdout { 
    codec => rubydebug 
  }
  file {
    path => "/usr/share/logstash/data/debug.log"
    codec => rubydebug
  }
}

